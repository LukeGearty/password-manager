{% extends 'layout.html' %}
{% block content %}
<h1>Dashboard of {{ user }}</h1>

{% if passwords %}
<table>
  <thead>
    <tr>
      <th>Website</th>
      <th>Password</th>
    </tr>
  </thead>
  <tbody>
    {% for key, value in passwords.items() %}
    <tr>
      <td>{{ key }}</td>
      <td class="password-cell"><span class="password-text">••••••••</span>
        <button class="toggle-btn" data-password="{{ value }}" data-visible="false">Show</button>
      <button class="copy-btn" data-password="{{ value }}">Copy</button></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p>No passwords saved yet.</p>
{% endif %}

<a href="/add_password">Add a password</a>

<script>
    const copyBtns = document.querySelectorAll('.copy-btn');

    copyBtns.forEach(button => {
        button.addEventListener('click', () => {
            const password = button.dataset.password;
            
            navigator.clipboard.writeText(password)
                .then(() => {
                    button.textContent = 'Copied';
                    setTimeout(() => button.textContent = 'Copy', 2000);
                })
                .catch(err => console.error('Failed to copy:', err));
        });
    });

    const toggleBtns = document.querySelectorAll('.toggle-btn');
    toggleBtns.forEach(button => {
        button.addEventListener('click', () => {
            const span = button.closest('tr').querySelector('.password-text');
            const visible = button.dataset.visible === 'true';
            span.textContent = visible ? '••••••••' : button.dataset.password;
            button.dataset.visible = !visible;
            button.textContent = visible ? 'Show' : 'Hide';
        });
    });

</script>
{% endblock %}
